name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -v experiment-08-testing/tests
      - run: python -m mlops_practicals.run_pipeline
      - uses: actions/upload-artifact@v4
        with:
          name: mlops-practical-outputs
          path: outputs/